spring.application.name=orbit-mobile-api
spring.config.import=optional:file:.env[.properties]

spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.auto-index-creation=true

brevo.api-key=${BREVO_API_KEY:}
mail.from=${MAIL_FROM:}
mail.from-name=${MAIL_FROM_NAME:Orbit}

server.port=${PORT:8080}
server.error.include-message=never

devhub.registration.otp-ttl=PT10M
devhub.registration.max-otp-attempts=5
devhub.registration.otp-hmac-secret=${OTP_HMAC_SECRET:}
devhub.registration.google-client-id=${GOOGLE_OAUTH_CLIENT_ID:}
devhub.registration.google-client-ids=${GOOGLE_OAUTH_CLIENT_IDS:${GOOGLE_OAUTH_CLIENT_ID:}}
devhub.registration.google-client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:}
devhub.registration.google-redirect-uri=${GOOGLE_OAUTH_REDIRECT_URI:}
devhub.registration.github-client-id=${GITHUB_OAUTH_CLIENT_ID:}
devhub.registration.github-client-secret=${GITHUB_OAUTH_CLIENT_SECRET:}
devhub.registration.github-redirect-uri=${GITHUB_OAUTH_REDIRECT_URI:}

devhub.security.jwt-secret=${JWT_SECRET:}
devhub.security.access-token-ttl=PT15M
devhub.security.refresh-token-ttl=P30D
spring.jackson.default-property-inclusion=non_null
springdoc.swagger-ui.path=/swagger-ui.html
devhub.websocket.allowed-origin-patterns=${DEVHUB_WEBSOCKET_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,https://localhost:*,capacitor://localhost}
management.endpoint.health.show-details=always

